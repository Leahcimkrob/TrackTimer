  invalid-date-or-time: "<red>Ungültiges Datum oder Uhrzeit. Nutze einen Wert aus der Tab-Vervollständigung."
  command-failed: "<red>Die Rennauswertung konnte nicht geladen werden."
  hologram-plugin-missing: "<red>Weder CMI noch DecentHolograms ist installiert und aktiviert."
  hologram-tool-started: "<yellow>Hologramm-Werkzeug für <event>: Linksklick auf die obere linke Ecke. Schreibe exit zum Abbrechen."
  hologram-event-missing: "<red>Das ausgewählte Event existiert nicht mehr."
  hologram-first-corner: "<green>Erste Ecke gesetzt (<x>, <y>, <z>). Rechtsklick auf die untere rechte Ecke."
  hologram-select-first-corner: "<red>Setze zuerst mit Linksklick die obere linke Ecke."
  hologram-same-world: "<red>Beide Ecken müssen in derselben Welt liegen."
  hologram-invalid-area: "<red>Ungültiger Bereich. Wähle zwei Ecken an derselben Wandfläche."
  hologram-created: "<green>Ergebnis-Hologramm für <yellow><event></yellow> wird gesetzt und ausgerichtet. Es aktualisiert sich nach abgeschlossenen Rennen."
  hologram-tool-cancelled: "<yellow>Hologramm-Auswahl abgebrochen."
  hologram-delete-tool-started: "<yellow>Hologramm-Löschwerkzeug erhalten. Klicke einen Block innerhalb des Hologrammbereichs an."
  hologram-delete-not-found: "<red>In diesem Bereich wurde kein Hologramm gefunden."
  hologram-deleted: "<green><count> Hologramm(e) aus der Datenbank gelöscht."

leaderboard:
  header: "<gold>Bestenliste - <event>"
  entry: "<white>#<rank> <yellow><player> <gray>- <white><time>"
  empty: "<gray>Für dieses Event liegen noch keine Ergebnisse vor."

database:
  connected: "<green>Datenbank (<yellow><type></yellow>) erfolgreich verbunden."
  error: "<red>Datenbankfehler: <message>"
  converted: "<green>Daten wurden von <yellow><from></yellow> nach <yellow><to></yellow> übertragen."
  convert-invalid: "<red>Ungültige Datenbanktypen. Erlaubt sind sqlite und mysql; Quelle und Ziel müssen verschieden sein."
  convert-failed: "<red>Datenübertragung fehlgeschlagen: <message>"


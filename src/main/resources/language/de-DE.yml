# Platzhalter werden vom MiniMessage-System im Format <placeholder> ersetzt.
prefix: "<dark_gray>[<gold>TrackTimer</gold>]</dark_gray> <reset>"

general:
  no-permission: "<red>Du hast keine Berechtigung für diesen Befehl."
  player-only: "<red>Dieser Befehl kann nur von Spielern ausgeführt werden."
  unknown-command: "<red>Unbekannter Befehl. Nutze /tracktimer help für Hilfe."
  reload: "<green>Konfiguration und Sprachdateien wurden neu geladen."

config-editor:
  save-failed: "<red>Die Konfiguration konnte nicht gespeichert werden."

help:
  config: "<yellow>/<command> config <gray>- Öffnet die Konfigurations-GUI."
  header: "<gold>=== TrackTimer Hilfe ==="
  reload: "<yellow>/<command> reload <gray>- Lädt Konfiguration und Sprachdateien neu."
  create: "<yellow>/<command> create <eventname> <laps> <mode: player|signal> <gray>- Erstellt ein Event."
  delete: "<yellow>/<command> delete <eventname> [confirm|cancel] <gray>- Löscht ein Event nach Chat-Bestätigung."
  reset: "<yellow>/<command> reset <eventname> [confirm|cancel] <gray>- Löscht Rennergebnisse und Checkpoint-Zeiten."
  editor: "<yellow>/<command> editor <gray>- Öffnet die Event-Übersicht."
  overview: "<yellow>/<command> overview <gray>- Öffnet die Event-Übersicht mit den TopTen."
  convert: "<yellow>/<command> convert <from> <to> <gray>- Überträgt Daten zwischen SQLite und MySQL."
  leave: "<yellow>/<command> leave <gray>- Bricht deinen aktuellen Lauf ab."
  topten: "<yellow>/<command> topten <event> [datum [uhrzeit]] <gray>- Ohne Datum: normale Rennen; mit Datum: Ampel-Rennen."
  hologram: "<yellow>/<command> hologram add <event> [datum [uhrzeit]] <gray>- Ohne Datum: normale Rennen; mit Datum: Ampel-Rennen. <yellow>/<command> hologram addlive <event> <gray>- Gibt das Livehologramm-Werkzeug. <yellow>/<command> hologram remove <gray>- Gibt das Löschwerkzeug. <yellow>/<command> hologram reload <gray>- Lädt alle Hologramme neu."
  help: "<yellow>/<command> help <gray>- Zeigt diese Hilfe an."

event:
  created: "<green>Event <yellow><event></yellow> wurde erstellt (<yellow><laps></yellow> Runden, Modus <yellow><mode></yellow>)."
  already-exists: "<red>Ein Event mit dem Namen <yellow><event></yellow> existiert bereits."
  name-updated: "<green>Der Eventname wurde zu <yellow><event></yellow> geändert."
  invalid-name: "<red>Ungültiger Eventname. Erlaubt sind 1 bis 128 Buchstaben, Zahlen, Unterstriche und Bindestriche."
  create-failed: "<red>Event <yellow><event></yellow> konnte wegen eines Datenbankfehlers nicht erstellt werden."
  not-found: "<red>Event <yellow><event></yellow> wurde nicht gefunden."
  deleted: "<green>Event <yellow><event></yellow> wurde gelöscht."
  data-overview: "<gold>Event #<id>: <yellow><event></yellow><gray> | Runden: <white><laps><gray> | Startmodus: <white><start_mode><gray> | Icon: <white><icon><gray> | Trigger: <white><trigger_count><gray> | Erstellt: <white><created>"
  delete-confirmation: "<red>Dieses Event und alle Rennergebnisse sowie Checkpoint-Zeiten löschen?"
  delete-confirm-button: "<green><bold>[Löschen]</bold>"
  delete-cancel-button: "<gray>[Abbrechen]"
  delete-confirm-command: "<gray>Oder eingeben: <yellow><confirm_command>"
  delete-confirmation-missing: "<red>Es gibt keine passende ausstehende Löschbestätigung."
  delete-confirmation-expired: "<red>Die Löschbestätigung für Event <yellow><event></yellow> ist abgelaufen. Starte den Befehl erneut."
  delete-cancelled: "<yellow>Löschen abgebrochen."
  delete-failed: "<red>Event <yellow><event></yellow> konnte wegen eines Datenbankfehlers nicht gelöscht werden."
  reset-confirmation: "<red>Alle Rennergebnisse und Checkpoint-Zeiten dieses Events löschen? Event und Trigger bleiben erhalten."
  reset-confirm-button: "<green><bold>[Zurücksetzen]</bold>"
  reset-cancel-button: "<gray>[Abbrechen]"
  reset-confirm-command: "<gray>Oder eingeben: <yellow><confirm_command>"
  reset-confirmation-missing: "<red>Es gibt keine passende ausstehende Reset-Bestätigung."
  reset-confirmation-expired: "<red>Die Reset-Bestätigung für Event <yellow><event></yellow> ist abgelaufen. Starte den Befehl erneut."
  reset-cancelled: "<yellow>Zurücksetzen abgebrochen."
  reset-complete: "<green>Rennergebnisse und Checkpoint-Zeiten für Event <yellow><event></yellow> wurden gelöscht. Event und Trigger bleiben erhalten."
  reset-failed: "<red>Rennergebnisse für Event <yellow><event></yellow> konnten wegen eines Datenbankfehlers nicht zurückgesetzt werden."
  list-header: "<gold>Verfügbare Events:"
  list-entry: "<yellow>- <event> <gray>(<laps> Runden)"
  list-failed: "<red>Die Events konnten nicht geladen werden."

gui:
  player-only: "<red>Der Editor kann nur von Spielern geöffnet werden."


trigger:
  added: "<green>Trigger <yellow><type></yellow> wurde für Event <yellow><event></yellow> hinzugefügt."
  removed: "<green>Trigger wurde entfernt."
  invalid-type: "<red>Ungültiger Trigger-Typ. Erlaubt: start, checkpoint, end."
  checkpoint-order-required: "<red>Für Checkpoints muss eine Reihenfolge angegeben werden."
  start-selection-started: "<green>Startpunkt-Auswahl aktiv: Links hinzufügen, rechts entfernen, <yellow>exit</yellow> im Chat beendet die Auswahl."
  start-selection-ended: "<green>Startpunkt-Auswahl beendet."
  end-selection-started: "<green>Endpunkt-Auswahl aktiv: Links hinzufügen, rechts entfernen, <yellow>exit</yellow> im Chat beendet die Auswahl."
  end-selection-ended: "<green>Endpunkt-Auswahl beendet."
  redstone-selection-started: "<green>Redstone-Startsignal-Auswahl aktiv: Links hinzufügen, rechts entfernen, <yellow>exit</yellow> im Chat beendet die Auswahl."
  redstone-selection-ended: "<green>Redstone-Startsignal-Auswahl beendet."
  pressure-plate-not-pressed: "<red>Die Druckplatte muss beim Hinzufügen gedrückt sein."
  start-added: "<green>Startpunkt gespeichert."
  end-added: "<green>Endpunkt gespeichert."
  redstone-added: "<green>Redstone-Startsignal gespeichert."
  checkpoint-selection-started: "<green>Checkpoint-Auswahl aktiv: Links hinzufügen, rechts entfernen, <yellow>exit</yellow> im Chat beendet die Auswahl."
  checkpoint-selection-ended: "<green>Checkpoint-Auswahl beendet."
  checkpoint-order-selected: "<green>Die nächste Checkpoint-Nummer ist <yellow><number></yellow>."
  server-unavailable: "<red>Dieser Trigger befindet sich auf einem anderen Server."
  world-unavailable: "<red>Die Welt dieses Triggers ist auf diesem Server nicht geladen."
  checkpoint-added: "<green>Checkpoint <yellow><number></yellow> gespeichert."
  checkpoint-order-used: "<red>Checkpoint <yellow><number></yellow> existiert bereits. Beende die Auswahl mit exit und starte das Werkzeug erneut für den nächsten Checkpoint."
  already-exists: "<yellow>Für diesen Event ist an diesem Block bereits ein entsprechender Trigger gesetzt."
  not-found: "<red>Hier ist kein passender Trigger für dieses Event gespeichert."

race:
  bossbar:
    text: "<yellow><event></yellow> <white><time>"
    # Verfügbare Zeit-Platzhalter: <hours>, <minutes>, <seconds>, <ms>.
    # Beispiel: "<hours>:<minutes>:<seconds>:<ms>" ergibt 00:00:00:00.
    time-format: "<hours>:<minutes>:<seconds>:<ms>"
  started: "<green>Dein Lauf für <yellow><event></yellow> hat begonnen!"
  checkpoint: "<yellow>Checkpoint <white><order></white> <gray>| Zwischenzeit <white><time> <gray>| Runde <white><lap>/<laps>"
  lap-completed: "<green>Runde <white><lap></white>/<white><laps></white> abgeschlossen."
  finished: "<gold>Ziel erreicht!\nDeine Zeit: <yellow><time>"
  start-title: "<green>!!! Go Go Go !!!"
  redstone-session-finished: "<red>Rennen beendet!\n1:<winner> | 2: <second> | 3: <third>"
  already-running: "<red>Du fährst bereits auf <yellow><event></yellow>."
  not-running: "<red>Du fährst aktuell keine Strecke."
  cancelled: "<yellow>Dein Lauf wurde abgebrochen und die aktuellen Renndaten wurden gelöscht."
  new-record: "<gold><bold>Neuer Rekord auf <event>! </bold><gold>Zeit: <white><time>"

race-statistics:
  holograms-reloaded: "<green>Hologramme neu geladen."
  chat-title: "<gold>Rennergebnisse für <yellow><event>"
  redstone-chat-title: "<gold>Rennen für <yellow><event> <dark_gray>| <white><date> <time_of_day>"
  chat-empty: "<gray>Für dieses Event liegen noch keine abgeschlossenen Rennen vor."
  chat-filter-empty: "<gray>Für diese Datum-/Uhrzeitauswahl gibt es keine Rennen."
  normal-entry: "<yellow><rank>. <player> <dark_gray>| <white><race_time> <dark_gray>| <white><laps> Runden <dark_gray>| <white><races> Rennen gefahren"
  redstone-entry: "<yellow><rank>. <player> <dark_gray>| <white><race_time> <dark_gray>| <white><laps> Runden"
  duration-format: "<hours>:<minutes>:<seconds>.<centiseconds>"
  hologram-columns:
    rank: "<gold>Platz"
    player: "<gold>Spieler"
    time: "<gold>Zeit"
    laps: "<gold>Runden"
    races: "<gold>Rennen"

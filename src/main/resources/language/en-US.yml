# Placeholders are replaced by the MiniMessage system using the <placeholder> format.
prefix: "<dark_gray>[<gold>TrackTimer</gold>]</dark_gray> <reset>"

general:
  no-permission: "<red>You do not have permission to use this command."
  player-only: "<red>This command can only be used by players."
  unknown-command: "<red>Unknown command. Use /tracktimer help for help."
  reload: "<green>Configuration and language files have been reloaded."

config-editor:
  save-failed: "<red>Could not save the configuration."

help:
  config: "<yellow>/<command> config <gray>- Opens the configuration GUI."
  header: "<gold>=== TrackTimer Help ==="
  reload: "<yellow>/<command> reload <gray>- Reloads the configuration and language files."
  create: "<yellow>/<command> create <eventname> <laps> <mode: player|signal> <gray>- Creates an event."
  delete: "<yellow>/<command> delete <eventname> [confirm|cancel] <gray>- Deletes an event after chat confirmation."
  reset: "<yellow>/<command> reset <eventname> [confirm|cancel] <gray>- Clears race results and checkpoint times."
  editor: "<yellow>/<command> editor <gray>- Opens the event overview."
  overview: "<yellow>/<command> overview <gray>- Opens the event overview and TopTen."
  convert: "<yellow>/<command> convert <from> <to> <gray>- Copies data between SQLite and MySQL."
  leave: "<yellow>/<command> leave <gray>- Cancels your current run."
  topten: "<yellow>/<command> topten <event> [date|time] <gray>- Displays race statistics in chat."
  hologram: "<yellow>/<command> hologram add <event> [date time] <gray>- Gives the placement tool. <yellow>/<command> hologram remove <gray>- Gives the removal tool."
  help: "<yellow>/<command> help <gray>- Shows this help."

event:
  created: "<green>Event <yellow><event></yellow> has been created (<yellow><laps></yellow> laps, mode <yellow><mode></yellow>)."
  already-exists: "<red>An event named <yellow><event></yellow> already exists."
  name-updated: "<green>The event name was changed to <yellow><event></yellow>."
  invalid-name: "<red>Invalid event name. Use 1 to 128 letters, digits, underscores, or hyphens."
  create-failed: "<red>Event <yellow><event></yellow> could not be created because of a database error."
  not-found: "<red>Event <yellow><event></yellow> was not found."
  deleted: "<green>Event <yellow><event></yellow> has been deleted."
  data-overview: "<gold>Event #<id>: <yellow><event></yellow><gray> | Laps: <white><laps><gray> | Start mode: <white><start_mode><gray> | Icon: <white><icon><gray> | Triggers: <white><trigger_count><gray> | Created: <white><created>"
  delete-confirmation: "<red>Delete this event and all race results and checkpoint times?"
  delete-confirm-button: "<green><bold>[Delete]</bold>"
  delete-cancel-button: "<gray>[Cancel]"
  delete-confirm-command: "<gray>Or type: <yellow><confirm_command>"
  delete-confirmation-missing: "<red>There is no matching pending delete confirmation."
  delete-confirmation-expired: "<red>The delete confirmation for event <yellow><event></yellow> expired. Run the command again."
  delete-cancelled: "<yellow>Deletion cancelled."
  delete-failed: "<red>Event <yellow><event></yellow> could not be deleted because of a database error."
  reset-confirmation: "<red>Delete all race results and checkpoint times for this event? The event and triggers will remain."
  reset-confirm-button: "<green><bold>[Reset]</bold>"
  reset-cancel-button: "<gray>[Cancel]"
  reset-confirm-command: "<gray>Or type: <yellow><confirm_command>"
  reset-confirmation-missing: "<red>There is no matching pending reset confirmation."
  reset-confirmation-expired: "<red>The reset confirmation for event <yellow><event></yellow> expired. Run the command again."
  reset-cancelled: "<yellow>Reset cancelled."
  reset-complete: "<green>Race results and checkpoint times for event <yellow><event></yellow> were deleted. The event and triggers remain."
  reset-failed: "<red>Race results for event <yellow><event></yellow> could not be reset because of a database error."
  list-header: "<gold>Available events:"
  list-entry: "<yellow>- <event> <gray>(<laps> laps)"
  list-failed: "<red>Could not load events."

gui:
  player-only: "<red>The editor can only be opened by players."


trigger:
  added: "<green>Trigger <yellow><type></yellow> has been added to event <yellow><event></yellow>."
  removed: "<green>Trigger has been removed."
  invalid-type: "<red>Invalid trigger type. Allowed: start, checkpoint, end."
  checkpoint-order-required: "<red>Checkpoints require an order value."
  start-selection-started: "<green>Start selection active: left-click to add, right-click to remove, type <yellow>exit</yellow> to finish."
  start-selection-ended: "<green>Start selection finished."
  end-selection-started: "<green>End selection active: left-click to add, right-click to remove, type <yellow>exit</yellow> to finish."
  end-selection-ended: "<green>End selection finished."
  redstone-selection-started: "<green>Redstone start signal selection active: left-click to add, right-click to remove, type <yellow>exit</yellow> to finish."
  redstone-selection-ended: "<green>Redstone start signal selection finished."
  pressure-plate-not-pressed: "<red>The pressure plate must be pressed when adding it."
  start-added: "<green>Start point saved."
  end-added: "<green>End point saved."
  redstone-added: "<green>Redstone start signal saved."
  checkpoint-selection-started: "<green>Checkpoint selection active: left-click to add, right-click to remove, type <yellow>exit</yellow> to finish."
  checkpoint-selection-ended: "<green>Checkpoint selection finished."
  checkpoint-order-selected: "<green>The next checkpoint number is <yellow><number></yellow>."
  server-unavailable: "<red>This trigger is on a different server."
  world-unavailable: "<red>This trigger's world is not loaded on this server."
  checkpoint-added: "<green>Checkpoint <yellow><number></yellow> saved."
  checkpoint-order-used: "<red>Checkpoint <yellow><number></yellow> already exists. Type exit and start the tool again for the next checkpoint."
  already-exists: "<yellow>This event already has a matching trigger at this block."
  not-found: "<red>No matching trigger for this event is saved here."

race:
  bossbar:
    text: "<yellow><event></yellow> <white><time>"
    # Available time placeholders: <hours>, <minutes>, <seconds>, <ms>.
    # Example: "<hours>:<minutes>:<seconds>:<ms>" displays 00:00:00:00.
    time-format: "<hours>:<minutes>:<seconds>:<ms>"
  started: "<green>Your run on <yellow><event></yellow> has started!"
  checkpoint: "<yellow>Checkpoint <white><order></white> <gray>| Split time <white><time> <gray>| Lap <white><lap>/<laps>"
  lap-completed: "<green>Lap <white><lap></white>/<white><laps></white> completed."
  finished: "<gold>Finish reached! Your time: <yellow><time>"
  start-title: "<green>!!! Go Go Go !!!"
  redstone-session-finished: "<red>Race finished!\n1: <winner> | 2: <second> | 3: <third>"
  already-running: "<red>You are already racing on <yellow><event></yellow>."
  not-running: "<red>You are not currently racing."
  cancelled: "<yellow>Your run was cancelled and its current race data was deleted."
  new-record: "<gold><bold>New record on <event>! </bold><gold>Time: <white><time>"

race-statistics:
  chat-title: "<gold>Race results for <yellow><event>"
  redstone-chat-title: "<gold>Race for <yellow><event> <dark_gray>| <white><date> <time_of_day>"
  chat-empty: "<gray>There are no completed races for this event yet."
  chat-filter-empty: "<gray>There are no races for that date/time selection."
  normal-entry: "<yellow><rank>. <player> <dark_gray>| <white><race_time> <dark_gray>| <white><laps> laps <dark_gray>| <white><races> races driven"
  redstone-entry: "<yellow><rank>. <player> <dark_gray>| <white><race_time> <dark_gray>| <white><laps> laps"
  duration-format: "<hours>:<minutes>:<seconds>.<centiseconds>"
  redstone-filter-only: "<red>You can only select a date or time for redstone races."
  invalid-date-or-time: "<red>Invalid date or time. Use a value from tab completion."
  command-failed: "<red>Could not load race statistics."
  hologram-plugin-missing: "<red>Neither CMI nor DecentHolograms is installed and enabled."
  hologram-tool-started: "<yellow>Hologram tool for <event>: left-click the upper-left corner. Type exit to cancel."
  hologram-event-missing: "<red>The selected event no longer exists."
  hologram-first-corner: "<green>First corner selected (<x>, <y>, <z>). Right-click the lower-right corner."
  hologram-select-first-corner: "<red>Left-click the upper-left corner first."
  hologram-same-world: "<red>Both corners must be in the same world."
  hologram-invalid-area: "<red>Invalid area. Select two corners on the same wall plane."
  hologram-created: "<green>Results hologram for <yellow><event></yellow> created. It updates after completed races."
  hologram-tool-cancelled: "<yellow>Hologram selection cancelled."
  hologram-delete-tool-started: "<yellow>Hologram removal tool given. Click a block inside a hologram area."
  hologram-delete-not-found: "<red>No hologram was found in this area."
  hologram-deleted: "<green>Removed <count> hologram(s) from the database."

leaderboard:
  header: "<gold>Leaderboard - <event>"
  entry: "<white>#<rank> <yellow><player> <gray>- <white><time>"
  empty: "<gray>No results for this event yet."

database:
  connected: "<green>Database (<yellow><type></yellow>) connected successfully."
  error: "<red>Database error: <message>"
  converted: "<green>Data copied from <yellow><from></yellow> to <yellow><to></yellow>."
  convert-invalid: "<red>Invalid database types. Allowed: sqlite and mysql; source and target must differ."
  convert-failed: "<red>Data conversion failed: <message>"

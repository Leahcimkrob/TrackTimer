# Placeholders are replaced by the MiniMessage system using the <placeholder> format.

# for HeadDatabase: https://minecraft-heads.com/custom-heads/heads-database
#     material: PLAYER_HEAD
#     head-database-id: "xxxxx" e.g. "75167"
#     fallback-material: e.g.: REDSTONE

config-editor:
  row-labels:
    language: "<gold>Language"
    race: "<gold>Race"
    statistics: "<gold>Race statistics (GUI)"
    hologram: "<gold>Race statistics (Holograms)"
    chat: "<gold>Chat"
  title: "TrackTimer - Configuration"
  number-name: "<yellow><label>: <white><value>"
  number-lore:
    - "<gray>Current: <white><value>"
    - "<green>Right-click: +<step>"
    - "<red>Left-click: -<step>"
  choice-lore:
    - "<gray>Current: <white><value>"
    - "<yellow>Click to cycle"
  close:
    name: "<green>Save and close"
    lore:
      - "<gray>Closing saves the settings and reloads TrackTimer."
  sort:
    descending: "Descending (newest first)"
    ascending: "Ascending (oldest first)"
  toggle:
    enabled: "<green>Enabled"
    disabled: "<red>Disabled"
  items:
    language:
      name: "<gold>Language"
    height:
      name: "<gold>Start trigger height tolerance"
      lore:
        - "<gray>Distance above and below in blocks."
    join-timeout:
      name: "<gold>Traffic light start timeout"
      lore:
        - "<gray>Seconds; 0 keeps the start armed."
    title-radius:
      name: "<gold>Start announcement radius"
      lore:
        - "<gray>Distance in blocks."
    gui-normal:
      name: "<gold>GUI: best times"
      lore:
        - "<gray>Player count; 0 shows no results."
    gui-signal:
      name: "<gold>GUI: traffic light races"
      lore:
        - "<gray>Number of recent races; 0 shows no results."
    player-details:
      name: "<gold>Player details: recent races"
      lore:
        - "<gray>Besides the fastest-lap race; 0 shows all."
    hologram-normal:
      name: "<gold>Hologram: best times"
      lore:
        - "<gray>Player count; 0 shows no results."
    hologram-signal:
      name: "<gold>Hologram: traffic light races"
      lore:
        - "<gray>Number of recent races; 0 shows no results."
    tool-timeout:
      name: "<gold>Hologram: tool timeout"
      lore:
        - "<gray>Seconds before removing the deletion tool."
    provider:
      name: "<gold>Hologram provider"
    show-player-heads:
      name: "<gold>Hologram: player heads"
      lore:
        - "<gray>Show player heads beside their names (CMI only)."
    chat-normal:
      name: "<gold>Chat: best times"
      lore:
        - "<gray>Player count; 0 shows no results."
    chat-signal:
      name: "<gold>Chat: traffic light races"
      lore:
        - "<gray>Number of recent races; 0 shows no results."
    sort:
      name: "<gold>Chat: date sorting"

overview:
  title: "TrackTimer - Overview"
  event-item:
    name: "<yellow><event>"
    lore:
      - "<gray>Laps: <white><laps>"
      - "<gray>Start mode: <white><start_mode>"
      - "<gray>Created: <white><created>"
    topten-click: "<yellow>Left-click or Shift-left-click: open TopTen"
    redstone-click: "<yellow>Left-click: select a redstone race"
    redstone-standard-click: "<yellow>Shift-left-click: open standard TopTen"
    edit-click: "<yellow>Right-click: edit event"
  empty-item:
    name: "<gray>No events available"

topten:
  title: "Single Race - <event>"
  redstone-title: "Redstone Race - <event>"
  entry-item:
    name: "<gold>Rank <rank>"
    lore:
      - "<gray>Name: <white><player>"
      - "<gray>Time: <white><race_time>"
      - "<gray>Laps: <white><laps>"
      - "<gray>Races driven: <white><races>"
      - "<yellow>Click: view lap details"
  redstone-entry:
    lore:
      - "<gray>Name: <white><player>"
      - "<gray>Time: <white><race_time>"
      - "<gray>Laps: <white><laps>"
      - "<gray>Race started: <white><date> <time_of_day>"
      - "<yellow>Click: view lap details"
  player-details:
    title: "Race days: <player> - <event>"
    fastest-lap:
      name: "<gold>Fastest lap"
      lore:
        - "<gray>Total time: <white><total_time>"
        - "<gray>Lap time: <green><lap_time>"
        - "<gray>Lap: <white><lap>"
        - "<gray>Race day: <white><date> <time_of_day>"
    checkpoint-line: "<dark_gray>CP <order>: <white><time>"
    lap:
      name: "<yellow>Lap <lap>"
      lore:
        - "<gray>Lap time: <white><lap_time>"
    empty-item:
      name: "<gray>No lap times stored"
  redstone-selection:
    title: "Traffic Light Races - <event>"
    empty-item:
      name: "<gray>No completed traffic light races yet"
  redstone-race:
    name: "<gold>Race <rank>"
    lore:
      - "<gray>1st place: <white><first>"
      - "<gray>2nd place: <white><second>"
      - "<gray>3rd place: <white><third>"
      - "<gray>Date: <white><date>"
      - "<gray>Time: <white><time_of_day>"
  empty-item:
    name: "<gray>No results yet"

event-editor:
  title: "Event Editor: <event>"
  event-name:
    name: "<yellow><event>"
    lore:
      - "<gray>Left-click to change the name"
  name-dialog:
    title: "Change event name: <event>"
    input-label: "New event name"
    save: "Save"
    cancel: "Cancel"
  laps:
    name: "<gold>Lap count"
    lore:
      - "<gray>Current: <white><laps>"
      - "<green>Right-click: +1"
      - "<red>Left-click: -1"
  start-mode:
    name: "<red>Start mode"
    lore:
      - "<gray>Start: <white><start_mode>"
      - "<yellow>Left-click to switch"
  change-icon:
    name: "<yellow>Change event item"
    lore:
      - "Click to change the event item"
    title: "Change event item: <event>"
  delete:
    name: "<red>Delete event"
    lore:
      - "<gray>Shift-left-click to delete"
  trigger-editor:
    name: "<gold>Configure triggers"
    lore:
      - "<gray>Left-click to open"

trigger-editor:
  title: "Triggers: <event>"
  start:
    name: "<green>Start trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Trigger mode: <trigger_mode>"
      - "<yellow>Shift-left-click: teleport to block"
  checkpoint:
    name: "<yellow>Checkpoint <number>"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Trigger mode: <trigger_mode>"
      - "<yellow>Shift-left-click: teleport to block"
  end:
    name: "<red>Finish trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Trigger mode: <trigger_mode>"
      - "<yellow>Shift-left-click: teleport to block"
  redstone:
    name: "<blue>Redsstone start signal"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Trigger mode: <trigger_mode>"
      - "<yellow>Shift-left-click: teleport to block"
  add-start:
    name: "<green>Set start trigger"
  add-redstone:
    name: "<blue>Set redstone start signal"
    lore:
      - "If you want to trigger the start signal with redstone,"
      - "you also need to set normal start triggers, because redstone"
      - "only activates the start signal."
  add-checkpoint:
    name: "<yellow>Set checkpoint"
  add-end:
    name: "<red>Set end trigger"
  tool:
    start:
      name: "<gold>Start trigger tool"
      lore: []
    checkpoint:
      name: "<gold>Checkpoint tool"
      lore: []
    end:
      name: "<gold>End trigger tool"
      lore: []
    redstone:
      name: "<gold>Redstone trigger tool"
      lore: []
    lore:
      - "<gray>Left-click: add trigger"
      - "<gray>Right-click: remove trigger"
      - "<yellow>Chat: exit to finish"

event-detail:
  title: "Event: <event>"
  info-item:
    name: "<gold>Information"
    lore:
      - "<gray>Laps: <white><laps>"
      - "<gray>Triggers: <white><trigger_count>"
  leaderboard-item:
    name: "<gold>Leaderboard"
    lore:
      - "<gray>Click to open the leaderboard"
  delete-item:
    name: "<red>Delete event"
    lore:
      - "<gray>Shift-click to confirm"

leaderboard:
  title: "Leaderboard - <event>"
  entry-item:
    name: "<yellow>#<rank> <player>"
    lore:
      - "<gray>Time: <white><time>"
      - "<gray>Laps: <white><laps>"
  empty-item:
    name: "<gray>No results yet"

buttons:
  hologram:
    name: "<gold>Place normal race hologram"
    lore:
      - "<gray>Gives you the tool to select the area."
      - "<yellow>Left-click: upper-left corner"
      - "<yellow>Right-click: lower-right corner"
  hologram-redstone:
    name: "<gold>Place redstone race hologram"
    lore:
      - "<gray>Displays redstone race results."
      - "<yellow>Left-click: upper-left corner"
      - "<yellow>Right-click: lower-right corner"
  hologram-delete:
    name: "<red>Delete results hologram"
    lore:
      - "<yellow>Left-click: delete hologram"
      - "<yellow>Right-click: cancel"
      - "<gray>The tool disappears after <seconds> seconds without use."
  close:
    name: "<red>Close"
  back:
    name: "<gray>Back"
  next-page:
    name: "<green>Next page"
  previous-page:
    name: "<green>Previous page"

overview:
  title: "TrackTimer - Overview"
  event-item:
    name: "<yellow><event>"
    lore:
      - "<gray>Laps: <white><laps>"
      - "<gray>Start mode: <white><start_mode>"
      - "<gray>Created: <white><created>"
  empty-item:
    name: "<gray>No events available"

event-editor:
  title: "Event Editor: <event>"
  event-name:
    name: "<yellow><event>"
    lore:
      - "<gray>Left-click to change the name"
  name-dialog:
    title: "Change event name: <event>"
    input-label: "New event name"
    save: "Save"
    cancel: "Cancel"
  laps:
    name: "<gold>Lap count"
    lore:
      - "<gray>Current: <white><laps>"
      - "<green>Right-click: +1"
      - "<red>Left-click: -1"
  start-mode:
    name: "<red>Start mode"
    lore:
      - "<gray>Start: <white><start_mode>"
      - "<yellow>Left-click to switch"
  change-icon:
    name: "<yellow>Change event item"
    lore:
      - "Click to change the event item"
    title: "Change event item: <event>"
  delete:
    name: "<red>Delete event"
    lore:
      - "<gray>Shift-left-click to delete"
  trigger-editor:
    name: "<gold>Configure triggers"
    lore:
      - "<gray>Left-click to open"

trigger-editor:
  title: "Triggers: <event>"
  start:
    name: "<green>Start trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
  checkpoint:
    name: "<yellow>Checkpoint <number>"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
  end:
    name: "<red>Finish trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
  unknown:
    name: "<gray>Unknown trigger"
    lore: []
  add-start:
    name: "<green>Set start trigger"
  add-checkpoint:
    name: "<yellow>Set checkpoint"
  add-end:
    name: "<red>Set end trigger"
  tool:
    start:
      name: "<gold>Start trigger tool"
    end:
      name: "<gold>End trigger tool"
    lore:
      - "<gray>Left-click: add trigger"
      - "<gray>Right-click: remove trigger"
      - "<yellow>Chat: exit to finish"

event-detail:
  title: "Event: <event>"
  info-item:
    name: "<gold>Information"
    lore:
      - "<gray>Laps: <white><laps>"
      - "<gray>Triggers: <white><trigger_count>"
  leaderboard-item:
    name: "<gold>Leaderboard"
    lore:
      - "<gray>Click to open the leaderboard"
  delete-item:
    name: "<red>Delete event"
    lore:
      - "<gray>Shift-click to confirm"

leaderboard:
  title: "Leaderboard - <event>"
  entry-item:
    name: "<yellow>#<rank> <player>"
    lore:
      - "<gray>Time: <white><time>"
      - "<gray>Laps: <white><laps>"
  empty-item:
    name: "<gray>No results yet"

buttons:
  close:
    name: "<red>Close"
  back:
    name: "<gray>Back"
  next-page:
    name: "<green>Next page"
  previous-page:
    name: "<green>Previous page"


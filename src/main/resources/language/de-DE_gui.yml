  event-item:
    name: "<yellow><event>"
    lore:
      - "<gray>Runden: <white><laps>"
      - "<gray>Startmodus: <white><start_mode>"
      - "<gray>Erstellt: <white><created>"
  empty-item:
    name: "<gray>Keine Events vorhanden"

event-editor:
  title: "Event-Editor: <event>"
  event-name:

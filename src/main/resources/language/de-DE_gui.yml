    lore:
      - "<gray>Aktuell: <white><laps>"
      - "<green>Rechtsklick: +1"
      - "<red>Linksklick: -1"
  start-mode:
    name: "<red>Startmodus"
    lore:
      - "<gray>Start: <white><start_mode>"
      - "<yellow>Linksklick zum Wechseln"
  change-icon:
    name: "<yellow>Event-Item ändern"
    lore:
      - "Anklicken um Event-Item zu Ändern"
    title: "Event-Item ändern: <event>"
  delete:
    name: "<red>Event löschen"
    lore:
      - "<gray>Shift-Linksklick zum Löschen"
  trigger-editor:
    name: "<gold>Trigger konfigurieren"
    lore:
      - "<gray>Linksklick zum Öffnen"

trigger-editor:
  title: "Trigger: <event>"
  start:
    name: "<green>Start-Trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
  checkpoint:
    name: "<yellow>Checkpoint <number>"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
  end:
    name: "<red>Ende-Trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
  unknown:
    name: "<gray>Unbekannter Trigger"

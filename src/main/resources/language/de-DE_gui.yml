  add-trigger:
    name: "<gold>Trigger setzen"
    lore:
      - "<green>Linksklick: Start"
      - "<red>Shift-Linksklick: Stop"
      - "<yellow>Rechtsklick: Checkpoint"

event-detail:
  title: "Event: <event>"
  info-item:
    name: "<gold>Informationen"
    lore:
      - "<gray>Runden: <white><laps>"
      - "<gray>Trigger: <white><trigger_count>"
  leaderboard-item:
    name: "<gold>Bestenliste"

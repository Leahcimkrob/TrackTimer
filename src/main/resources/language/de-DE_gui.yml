# Platzhalter werden vom MiniMessage-System im Format <placeholder> ersetzt.

# for HeadDatabase: https://minecraft-heads.com/custom-heads/heads-database
#     material: PLAYER_HEAD
#     head-database-id: "xxxxx" e.g. "75167"
#     fallback-material: e.g.: REDSTONE

config-editor:
  row-labels:
    language: "<gold>Sprache"
    race: "<gold>Race"
    statistics: "<gold>Rennstatistik (GUI)"
    hologram: "<gold>Rennstatistik (Hologramm)"
    chat: "<gold>Chat"
  title: "TrackTimer - Konfiguration"
  number-name: "<yellow><label>: <white><value>"
  number-lore:
    - "<gray>Aktuell: <white><value>"
    - "<green>Rechtsklick: +<step>"
    - "<red>Linksklick: -<step>"
  choice-lore:
    - "<gray>Aktuell: <white><value>"
    - "<yellow>Anklicken zum Wechseln"
  close:
    name: "<green>Speichern und schließen"
    lore:
      - "<gray>Beim Schließen speichern und TrackTimer neu laden."
  sort:
    descending: "Absteigend (neueste zuerst)"
    ascending: "Aufsteigend (älteste zuerst)"
  toggle:
    enabled: "<green>Aktiv"
    disabled: "<red>Inaktiv"
  items:
    language:
      name: "<gold>Sprache"
    height:
      name: "<gold>Höhentoleranz des Start-Triggers"
      lore:
        - "<gray>Abstand nach oben und unten in Blöcken."
    join-timeout:
      name: "<gold>Wartezeit beim Ampel-Start"
      lore:
        - "<gray>Sekunden; 0 hält den Start freigegeben."
    title-radius:
      name: "<gold>Radius der Start-Ankündigung"
      lore:
        - "<gray>Reichweite in Blöcken."
    gui-normal:
      name: "<gold>GUI: Bestzeiten"
      lore:
        - "<gray>Spieleranzahl; 0 zeigt keine Ergebnisse."
    gui-signal:
      name: "<gold>GUI: Ampel-Rennen"
      lore:
        - "<gray>Anzahl der letzten Rennen; 0 zeigt keine Ergebnisse."
    player-details:
      name: "<gold>Spieler-Details: letzte Rennen"
      lore:
        - "<gray>Zusätzlich zum schnellsten Rundenrennen; 0 zeigt alle."
    hologram-normal:
      name: "<gold>Hologramm: Bestzeiten"
      lore:
        - "<gray>Spieleranzahl; 0 zeigt keine Ergebnisse."
    hologram-signal:
      name: "<gold>Hologramm: Ampel-Rennen"
      lore:
        - "<gray>Anzahl der letzten Rennen; 0 zeigt keine Ergebnisse."
    tool-timeout:
      name: "<gold>Hologramm: Werkzeug-Timeout"
      lore:
        - "<gray>Sekunden bis das Löschwerkzeug entfernt wird."
    live-update:
      name: "<gold>Livehologramm: Aktualisierung (Ticks)"
      lore:
        - "<gray>20 Ticks = 1 Sekunde. Empfohlen: 10."
    live-retention:
      name: "<gold>Livehologramm: Ergebnis-Anzeigedauer"
      lore:
        - "<gray>Minuten nach Rennende. Standard: 10 Minuten."
        - "<gray>Änderung in Schritten von 0,5 Minuten."
        - "<gray>Ein neuer Start ersetzt die letzte Anzeige."
    provider:
      name: "<gold>Hologramm-Anbieter"
    show-player-heads:
      name: "<gold>Hologramm: Spielerköpfe"
      lore:
        - "<gray>Spielerköpfe neben den Namen anzeigen (nur CMI)."
    chat-normal:
      name: "<gold>Chat: Bestzeiten"
      lore:
        - "<gray>Spieleranzahl; 0 zeigt keine Ergebnisse."
    chat-signal:
      name: "<gold>Chat: Ampel-Rennen"
      lore:
        - "<gray>Anzahl der letzten Rennen; 0 zeigt keine Ergebnisse."
    sort:
      name: "<gold>Chat: Datumssortierung"

overview:
  title: "TrackTimer - Übersicht"
  event-item:
    name: "<yellow><event>"
    lore:
      - "<gray>Runden: <white><laps>"
      - "<gray>Startmodus: <white><start_mode>"
      - "<gray>Erstellt: <white><created>"
    topten-click: "<yellow>Linksklick oder Shift-Linksklick: TopTen öffnen"
    redstone-click: "<yellow>Linksklick: Redstone-Rennen auswählen"
    redstone-standard-click: "<yellow>Shift-Linksklick: normale TopTen öffnen"
    edit-click: "<yellow>Rechtsklick: Event bearbeiten"
  empty-item:
    name: "<gray>Keine Events vorhanden"

topten:
  title: "Einzelrennen - <event>"
  redstone-title: "Ampel-Rennen - <event>"
  entry-item:
    name: "<gold>Platz <rank>"
    lore:
      - "<gray>Name: <white><player>"
      - "<gray>Zeit: <white><race_time>"
      - "<gray>Runden: <white><laps>"
      - "<gray>Gefahrene Rennen: <white><races>"
      - "<yellow>Klick: Runden-Details anzeigen"
  redstone-entry:
    lore:
      - "<gray>Name: <white><player>"
      - "<gray>Zeit: <white><race_time>"
      - "<gray>Runden: <white><laps>"
      - "<gray>Rennstart: <white><date> <time_of_day>"
      - "<yellow>Klick: Runden-Details anzeigen"
  player-details:
    title: "Renntage: <player> - <event>"
    fastest-lap:
      name: "<gold>Schnellste Runde"
      lore:
        - "<gray>Gesamtzeit: <white><total_time>"
        - "<gray>Rundenzeit: <green><lap_time>"
        - "<gray>Runde: <white><lap>"
        - "<gray>Renntag: <white><date> <time_of_day>"
    checkpoint-line: "<dark_gray>CP <order>: <white><time>"
    lap:
      name: "<yellow>Runde <lap>"
      lore:
        - "<gray>Rundenzeit: <white><lap_time>"
    empty-item:
      name: "<gray>Keine Rundenzeiten gespeichert"
  redstone-selection:
    title: "Ampel-Rennen - <event>"
    empty-item:
      name: "<gray>Noch keine abgeschlossenen Ampel-Rennen"
  redstone-race:
    name: "<gold><rank>. Rennen"
    lore:
      - "<gray>1. Platz: <white><first>"
      - "<gray>2. Platz: <white><second>"
      - "<gray>3. Platz: <white><third>"
      - "<gray>Datum: <white><date>"
      - "<gray>Uhrzeit: <white><time_of_day>"
  empty-item:
    name: "<gray>Noch keine Ergebnisse"

event-editor:
  live-hologram:
    name: "<gold>Livehologramm erstellen"
    lore:
      - "<gray>Zeigt die laufenden Teilnehmer und Zeiten."
      - "<yellow>Linksklick: obere linke Ecke wählen."
      - "<yellow>Rechtsklick: untere rechte Ecke wählen."
      - "<gray>Mit exit im Chat abbrechen."
  title: "Event-Editor: <event>"
  event-name:
    name: "<yellow><event>"
    lore:
      - "<gray>Linksklick zum Namen ändern"
  name-dialog:
    title: "Eventnamen ändern: <event>"
    input-label: "Neuer Eventname"
    save: "Speichern"
    cancel: "Abbrechen"
  laps:
    name: "<gold>Rundenanzahl"
    lore:
      - "<gray>Aktuell: <white><laps>"
      - "<green>Rechtsklick: +1"
      - "<red>Linksklick: -1"
  start-mode:
    name: "<red>Startmodus"
    lore:
      - "<gray>Start: <white><start_mode>"
      - "<yellow>Linksklick zum Wechseln"
  change-icon:
    name: "<yellow>Event-Item ändern"
    lore:
      - "Anklicken um Event-Item zu Ändern"
    title: "Event-Item ändern: <event>"
  delete:
    name: "<red>Event löschen"
    lore:
      - "<gray>Shift-Linksklick zum Löschen"
  trigger-editor:
    name: "<gold>Trigger konfigurieren"
    lore:
      - "<gray>Linksklick zum Öffnen"

trigger-editor:
  title: "Trigger: <event>"
  start:
    name: "<green>Start-Trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<yellow>Shift-Linksklick: zum Block teleportieren"
  checkpoint:
    name: "<yellow>Checkpoint <number>"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Auslösung: <trigger_mode>"
      - "<yellow>Shift-Linksklick: zum Block teleportieren"
  end:
    name: "<red>Ende-Trigger"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Auslösung: <trigger_mode>"
      - "<yellow>Shift-Linksklick: zum Block teleportieren"
  redstone:
    name: "<blue>Redstone-Startsignal"
    lore:
      - "<gray><server>/<world> <x>, <y>, <z>"
      - "<gray>Block: <block>"
      - "<gray>Auslösung: <trigger_mode>"
      - "<yellow>Shift-Linksklick: zum Block teleportieren"
  add-start:
    name: "<green>Start-Trigger setzen"
  add-redstone:
    name: "<blue>Redstone-Startsignal setzen"
    lore:
      - "Wenn du das Startsignal über Redstone auslösen möchtest,"
      - "musst du auch normale Start-Trigger setzen, da Redstone "
      - "nur das Startsignal auslöst."
  add-checkpoint:
    name: "<yellow>Checkpoint setzen"
  add-end:
    name: "<red>End-Trigger setzen"
  tool:
    start:
      name: "<gold>Start-Trigger-Werkzeug"
      lore: []
    checkpoint:
      name: "<gold>Checkpoint-Werkzeug"
      lore: []
    end:
      name: "<gold>End-Trigger-Werkzeug"
      lore: []
    redstone:
      name: "<gold>Redstone-Trigger-Werkzeug"
      lore: []

    lore:
      - "<gray>Linksklick: Trigger hinzufügen"
      - "<gray>Rechtsklick: Trigger entfernen"
      - "<yellow>Chat: exit zum Beenden"

event-detail:
  title: "Event: <event>"
  info-item:
    name: "<gold>Informationen"
    lore:
      - "<gray>Runden: <white><laps>"
      - "<gray>Trigger: <white><trigger_count>"
  leaderboard-item:
    name: "<gold>Bestenliste"
    lore:
      - "<gray>Klicke, um die Bestenliste zu öffnen"
  delete-item:
    name: "<red>Event löschen"
    lore:
      - "<gray>Shift-Klick zum Bestätigen"

leaderboard:
  title: "Bestenliste - <event>"
  entry-item:
    name: "<yellow>#<rank> <player>"
    lore:
      - "<gray>Zeit: <white><time>"
      - "<gray>Runden: <white><laps>"
  empty-item:
    name: "<gray>Noch keine Ergebnisse"

buttons:
  hologram:
    name: "<gold>Hologramm für normale Rennen setzen"
    lore:
      - "<gray>Gibt das Werkzeug zum Auswählen des Bereichs."
      - "<yellow>Linksklick: obere linke Ecke"
      - "<yellow>Rechtsklick: untere rechte Ecke"
  hologram-redstone:
    name: "<gold>Hologramm für Ampel-Rennen setzen"
    lore:
      - "<gray>Zeigt die Ergebnisse der Ampel-Rennen."
      - "<yellow>Linksklick: obere linke Ecke"
      - "<yellow>Rechtsklick: untere rechte Ecke"
  hologram-delete:
    name: "<red>Ergebnis-Hologramm löschen"
    lore:
      - "<yellow>Linksklick: Hologramm löschen"
      - "<yellow>Rechtsklick: abbrechen"
      - "<gray>Nach <seconds> Sekunden ohne Benutzung verschwindet das Werkzeug."
  close:
    name: "<red>Schließen"
  back:
    name: "<gray>Zurück"
  next-page:
    name: "<green>Nächste Seite"
  previous-page:
    name: "<green>Vorherige Seite"

# Layout for the six-row TopTen results GUI.

# for HeadDatabase: https://minecraft-heads.com/custom-heads/heads-database
#     material: PLAYER_HEAD
#     head-database-id: "xxxxx" e.g. "75167"
#     fallback-material: e.g.: REDSTONE

guis:
  topten:
    rows: 3
    columns: 5
    button-bar:
      material: GRAY_STAINED_GLASS_PANE
      back:
        slot: 49
        material: PLAYER_HEAD
        head-database-id: '94681'
        fallback-material: Arrow
    redstone-selection:
      rows: 3
      columns: 5
      item:
        material: CLOCK
      button-bar:
        material: GRAY_STAINED_GLASS_PANE
        back:
          slot: 49
          material: PLAYER_HEAD
          head-database-id: '94681'
          fallback-material: Arrow

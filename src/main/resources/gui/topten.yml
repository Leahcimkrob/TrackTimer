# Layout for the six-row TopTen results GUI.

# for HeadDatabase: https://minecraft-heads.com/custom-heads/heads-database
#     material: PLAYER_HEAD
#     head-database-id: "xxxxx" e.g. "75167"
#     fallback-material: e.g.: REDSTONE

guis:
  topten:
    rows: 3
    columns: 5
    button-bar:
      material: GRAY_STAINED_GLASS_PANE
      back:
        slot: 49
        material: PLAYER_HEAD
        head-database-id: '94681'
        fallback-material: Arrow
      hologram:
        slot: 45
        material: PLAYER_HEAD
        head-database-id: '1627'
        fallback-material: STICK
    redstone-selection:
      rows: 3
      columns: 5
      item:
        material: CLOCK
      button-bar:
        material: GRAY_STAINED_GLASS_PANE
        back:
          slot: 49
          material: PLAYER_HEAD
          head-database-id: '94681'
          fallback-material: Arrow
  player-details:
    rows: 5
    columns: 9
    items:
      fastest-lap:
        slot: 0
        material: PLAYER_HEAD
        head-database-id: '61214'
        fallback-material: CLOCK
      lap:
        material: PLAYER_HEAD
        head-database-id: '16836'
        fallback-material: CLOCK
    button-bar:
      material: GRAY_STAINED_GLASS_PANE
      previous-races:
        slot: 45
        material: ARROW
      previous-rounds:
        slot: 46
        material: ARROW
      back:
        slot: 49
        material: PLAYER_HEAD
        head-database-id: '94681'
        fallback-material: ARROW
      next-rounds:
        slot: 52
        material: ARROW
      next-races:
        slot: 53
        material: ARROW

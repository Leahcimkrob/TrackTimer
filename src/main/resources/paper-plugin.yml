name: TrackTimer
description: $description
prefix: vm_gui
version: '${version}'

main: de.ethria.trackTimer.TrackTimer
api-version: '26.2'
load: POSTWORLD

authors: [ Bloody_Mind ]

# HeadDatabase is optional: TrackTimer can add custom heads to its GUIs when
# the HeadDatabase plugin is installed, but works fine without it.
dependencies:
  server:
    HeadDatabase:
      load: BEFORE
      required: false
      join-classpath: true

# Note: Paper plugins (paper-plugin.yml) do not support a "commands:" YAML
# section. /tracktimer is registered in code via the lifecycle COMMANDS
# event using a Brigadier command tree (see TrackTimer.registerMainCommand
# and TrackTimerCommand.build).

permissions:
  tracktimer.*:
    description: Allows access to all TrackTimer commands.
    default: op
    children:
      tracktimer.command.help: true
      tracktimer.command.reload: true
      tracktimer.command.create: true
      tracktimer.command.delete: true
      tracktimer.command.reset: true
      tracktimer.command.editor: true

  tracktimer.command.reload:
    description: Allows reloading the TrackTimer configuration and language files.
    default: op

  tracktimer.command.help:
    description: Allows viewing the TrackTimer help message.
    default: op

  tracktimer.command.create:
    description: Allows creating TrackTimer events.
    default: op

  tracktimer.command.delete:
    description: Allows deleting TrackTimer events.
    default: op

  tracktimer.command.reset:
    description: Allows resetting TrackTimer race results.
    default: op

  tracktimer.command.editor:
    description: Allows opening the TrackTimer event editor.
    default: op

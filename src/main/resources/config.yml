# Language for chat and GUI messages. Matches files in the language/ folder,
# e.g. "de-DE" (language/de-DE.yml + language/de-DE_gui.yml) or "en-US".
language: de-DE

race:
  # Maximum vertical distance, in blocks, between a player/vehicle and a start trigger.
  # Increase this for elevated custom vehicles; lower it to avoid triggering tracks above/below.
  start-trigger-height-tolerance: 2.0

  # Seconds to wait for the first driver after a redstone start signal.
  # Set to 0 to keep the start armed until someone joins.
  redstone-start-join-timeout-seconds: 30

  # Distance in blocks for the redstone start title broadcast.
  redstone-start-title-radius-blocks: 50

command:
  # Additional aliases for the /tracktimer command (e.g. "tt").
  # Can only be changed by restarting.
  aliases:
    - tt

database:
  # Supported values: sqlite, mysql
  # Can only be changed by restarting.
  type: sqlite

  sqlite:
    # Relative paths are resolved from the plugin data folder.
    file: tracktimer.db

  mysql:
    host: localhost
    port: 3306
    database: tracktimer
    username: root
    password: ""
    useSSL: true
